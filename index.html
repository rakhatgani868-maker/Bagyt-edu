<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Saryagash Keleshek Mektebi — ЕНТ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f7f8fb;--ink:#172033;--mut:#5b6784;--line:#e2e8f0;--brand:#1447e6;--navy:#17233d;--soft:#edf3ff;--hi:#0e9f6e;--mid:#b7791f;--lo:#d9480f;--no:#8a94ad;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.55 Manrope,system-ui,sans-serif}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
.w{max-width:1240px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.bar{display:flex;align-items:center;justify-content:space-between;height:72px;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;line-height:1.1}
.brand svg{width:54px;height:54px}.brand small{display:block;font-size:10px;letter-spacing:.12em;color:var(--brand)}
.seg{display:flex;background:#f1f5f9;border-radius:12px;padding:4px}
.seg button{white-space:nowrap;border:0;-webkit-text-fill-color:currentColor;background:none;padding:8px 14px;border-radius:9px;font-weight:700;font-size:13px;color:#64748b}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px #0001}
.seg button.on.ab{color:#0f766e}
nav.main{display:flex;gap:18px;white-space:nowrap;font-weight:700;font-size:14px;color:#475569}
nav.main a:hover{color:var(--brand)}
.act{display:flex;align-items:center;gap:10px}
.lang{color:#172033;-webkit-text-fill-color:#172033;min-width:52px;border:1px solid var(--line);background:#fff;border-radius:10px;height:40px;padding:0 12px;font-weight:700;font-size:13px}
.cta{white-space:nowrap;background:var(--brand);color:#fff;border:0;border-radius:12px;height:44px;padding:0 20px;font-weight:700;box-shadow:0 8px 20px #1447e633}
.burger{color:#172033;-webkit-text-fill-color:#172033;display:none;width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:12px;font-size:20px}
#mm{display:none;border-top:1px solid var(--line);background:#fff;padding:16px 20px}
#mm.open{display:grid;gap:14px}#mm a{font-weight:700;padding:4px 0}
.hero{background:var(--soft);position:relative;overflow:hidden}
.hero .w{display:grid;grid-template-columns:1fr 1fr;align-items:center;min-height:520px;padding-bottom:110px}
.hero img{position:absolute;right:0;top:0;height:100%;width:52%;object-fit:cover;-webkit-mask-image:linear-gradient(90deg,transparent,#000 35%);mask-image:linear-gradient(90deg,transparent,#000 35%)}
.hero .tx{position:relative;z-index:2;padding:48px 0}
.pill{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--brand);text-transform:uppercase}
h1{font-size:clamp(34px,5.4vw,60px);line-height:1.05;letter-spacing:-.045em;font-weight:800;margin:22px 0 16px;color:#14213b}
h1 b{color:var(--brand)}.lead{color:#475569;font-size:18px;max-width:34em;margin:0 0 24px}
.chk{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:26px;font-size:13px;color:#475569}.chk span:before{content:"✓";color:var(--hi);margin-right:6px;font-weight:800}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:#fff;border:0;border-radius:14px;height:52px;padding:0 24px;font-weight:700;box-shadow:0 10px 24px #1447e633}
.btn.dk{background:var(--navy);box-shadow:none}
.ghost{font-weight:700;margin-left:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 50px #17233d14}
#finder,#a-calc{position:relative;z-index:5;margin:-90px auto 0;max-width:1080px;padding:26px 28px}
.k{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--brand);text-transform:uppercase}
h2{font-size:clamp(24px,3.2vw,36px);letter-spacing:-.035em;line-height:1.15;margin:6px 0 10px;font-weight:800}
label{display:block;font-size:12px;font-weight:700;color:#475569;margin:0 0 5px}
input,select{width:100%;height:46px;border:1px solid var(--line);background:#f8fafc;border-radius:12px;padding:0 12px;font:600 14px Manrope,sans-serif;color:var(--ink)}
input:focus,select:focus{outline:3px solid #2563eb44;border-color:#2563eb;background:#fff}
.g{display:grid;gap:14px}.g2{grid-template-columns:1.2fr 1.8fr}.g5{grid-template-columns:repeat(5,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.sc{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:end;margin-top:16px}
.tot{background:var(--navy);color:#fff;border-radius:14px;padding:6px 20px;text-align:center;min-width:130px}.tot b{display:block;font-size:30px;line-height:1.2}.tot span{font-size:11px;opacity:.7}
.note{font-size:13px;color:var(--mut);margin:8px 0 0}.note.w2{color:var(--mid);font-weight:700}
#results{padding:44px 0 20px}
.list{display:grid;gap:12px;grid-template-columns:repeat(2,1fr);margin-top:18px}
.it{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;padding:16px 18px;border-left:6px solid var(--no);border-radius:14px}
.it.hi{border-left-color:var(--hi)}.it.mid{border-left-color:var(--mid)}.it.lo{border-left-color:var(--lo)}
.it h3{margin:0;font-size:16px;line-height:1.3}.mt{color:var(--mut);font-size:13px}
.it .r{text-align:right}.it .n{font-size:24px;font-weight:800}
.tag{font-size:13px;font-weight:800;color:var(--no)}.hi .tag{color:var(--hi)}.mid .tag{color:var(--mid)}.lo .tag{color:var(--lo)}
.it a{color:var(--brand);font-weight:700;font-size:13px}
.empty{padding:30px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:14px;grid-column:1/-1}
.stats{background:var(--navy);color:#fff;border-radius:22px;display:grid;grid-template-columns:repeat(3,1fr);margin:36px 0}
.stats div{padding:26px 28px;border-left:1px solid #ffffff22}.stats div:first-child{border:0}.stats b{font-size:32px;display:block}.stats span{opacity:.7;font-size:14px}
section.s{padding:56px 0}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:24px}
.step{padding:24px;position:relative;background:#f8faff}.step i{position:absolute;right:18px;top:10px;font:800 40px Manrope;color:#dbe6ff;font-style:normal}
.step .ic{width:42px;height:42px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;margin-bottom:16px}
.step h3{margin:0 0 6px}.step p{margin:0;color:var(--mut);font-size:14px}
.ban{background:var(--brand);color:#fff;border-radius:26px;padding:40px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.ban h2{color:#fff;max-width:14em}.ban p{max-width:30em;opacity:.85}.ban .btn{background:#fff;color:var(--brand);box-shadow:none}
.abt{display:grid;grid-template-columns:1fr 1fr;gap:48px}
.mis{background:var(--soft);border-radius:16px;padding:18px 20px;margin-top:20px}.mis b{display:block;margin-bottom:4px}
.pc{padding:18px}.pc b{display:block}.pc span{font-size:13px;color:var(--mut)}
.contact{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:26px 0}
.contact .w{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.contact h3{margin:0}.cl{display:flex;gap:12px;flex-wrap:wrap}
.cl a{border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-weight:700;font-size:14px;background:#f8fafc}
.cl a:hover{border-color:var(--brand);color:var(--brand)}
footer{background:#fff;padding:22px 0;font-size:13px;color:var(--mut)}footer .w{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.soon{padding:90px 20px;text-align:center}.soon h2{margin-bottom:8px}
.ug{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.uc{padding:18px;display:flex;flex-direction:column;gap:8px}.uc h3{margin:0;font-size:16px;line-height:1.3}.uc .ls{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.uc a{color:var(--brand);font-weight:700;font-size:13px}.cd{background:var(--soft);color:var(--brand);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:800}.uc details{border-top:1px solid var(--line);padding-top:8px;margin-top:auto}.uc summary{cursor:pointer;font-weight:700;font-size:13px}.uc ul{margin:8px 0 0;padding:0;list-style:none;max-height:220px;overflow:auto;font-size:13px}.uc li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid #eef2f7}.uc li b{white-space:nowrap}.fl{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:14px}
.hero.tl{background:#ecf7f6}.pill.tl,.tl .k{color:#0f766e}.tl h1 b{color:#0f766e}.btn.tl{background:#0f766e;box-shadow:0 10px 24px #0f766e33}.ch{display:inline-block;background:#f1f5f9;border-radius:8px;padding:3px 9px;font-size:12px;font-weight:700;margin:6px 6px 0 0}.ch.lv{background:#e6f4f1;color:#0f766e}.it .lk{display:flex;gap:14px;margin-top:6px}.g4{grid-template-columns:1fr 1fr 1.4fr 1.6fr}.mo{display:block;margin:20px auto 0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 26px;font-weight:700;color:#172033;-webkit-text-fill-color:#172033}.sm{display:flex;flex-wrap:wrap;gap:8px 18px;margin:10px 0 0;font-weight:700;font-size:14px}.sm span:before{content:'';display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--no)}.sm .a:before{background:var(--hi)}.sm .b:before{background:var(--mid)}.sm .c:before{background:var(--lo)}.ow{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:22px}.ow .card{padding:22px}.ow b{display:block;margin-bottom:6px}.ow span{color:var(--mut);font-size:14px}
.mg{display:grid;grid-template-columns:1.25fr .95fr;gap:22px;margin-top:22px;align-items:start}.mg2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}.tl2{list-style:none;margin:0;padding:0;display:grid;gap:10px}.tl2 li{display:grid;grid-template-columns:165px 1fr;gap:14px;padding:14px 18px;background:#fff;border:1px solid var(--line);border-left:6px solid var(--brand);border-radius:14px;font-size:14px}.tl2 li.t1{border-left-color:var(--hi)}.tl2 li.t2{border-left-color:var(--mid)}.tl2 b{font-weight:800}.pc2{padding:22px}.pc2 h3{margin:0 0 8px;font-size:18px}.bl{margin:0;padding-left:18px;color:var(--mut);font-size:14px;display:grid;gap:8px}.th{list-style:none;margin:0;padding:0;font-size:14px}.th li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #eef2f7}.th b{color:var(--brand)}
[hidden]{display:none!important}
html[lang="kk"] body,html[lang="kk"] input,html[lang="kk"] select,html[lang="kk"] button,html[lang="kk"] .step i{font-family:Geologica,Manrope,system-ui,sans-serif}
header .w{max-width:1400px}
@media(max-width:1360px){.cta{display:none}}
@media(max-width:1100px){nav.main,.seg.d,.cta{display:none}.burger{display:block}}
@media(max-width:900px){.mg,.mg2{grid-template-columns:1fr}.tl2 li{grid-template-columns:1fr;gap:4px}.g4,.ow{grid-template-columns:1fr}.ug,.fl{grid-template-columns:1fr}.hero .w{grid-template-columns:1fr;min-height:0}.hero img{opacity:.18;width:100%}.g5{grid-template-columns:repeat(2,1fr)}.g2,.g3{grid-template-columns:1fr}.list,.steps,.abt{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.stats div{border-left:0;border-top:1px solid #ffffff22}.stats div:first-child{border:0}nav.main,.seg.d,.cta{display:none}.burger{display:block}.brand span{display:none}.sc{grid-template-columns:1fr}#finder,#a-calc{padding:20px 16px;margin-left:12px;margin-right:12px}.ban{padding:28px 22px}}
</style>
</head>

mdl:["Заранее подготовь ЭЦП и цифровые копии документов: заявления принимают онлайн.","Заявление на грант можно подать через приёмную комиссию вуза или онлайн: виртуальная приёмная комиссия вуза или портал eGov. Вузы и программы выбираешь внутри заявления.","Не откладывай на последний день: окно подачи на грант короткое (в 2026 году — 8 дней).","Список документов и порядок уточняй на сайте выбранного вуза и в объявлении Министерства науки и высшего образования.","После публикации списка грантов проверь, есть ли твоя фамилия, и следуй указаниям приёмной комиссии."],
aml:["Выбери 5–8 вузов разной сложности и проверь требования на официальной странице каждого.","Сдай языковой тест заранее: результаты действуют ограниченное время, срок указан на сайте теста и вуза.","Подготовь документы: паспорт, аттестат или транскрипт (иногда с переводом), мотивационное письмо, рекомендации.","Узнай дедлайны каждого вуза: они разные и меняются из года в год.","Заранее посмотри стоимость обучения, стипендии, визу и подтверждение финансов."],

mcl:["ЖОО-дан емес, мамандықтан бастаңыз: қандай пәндер қажет екенін тексеріңіз (калькулятор жұпты көрсетеді).","Үш түрлі ЖОО таңдаңыз: арман, шынайы және қосалқы. Өз балыңызды өткен жылғы минимуммен салыстырыңыз.","Тек балға қарамаңыз: қала, жатақхана, оқыту тілі, оқытушылар, түлектердің жұмысқа орналасуы.","ЖОО сайтынан қосымша емтихандар керек пе, тексеріңіз (шығармашылық, педагогтер мен медиктерге арнайы емтихандар).","3–5 нұсқадан тұратын тізім жасап, өтініш бергенге дейін ЖОО сайттарымен салыстырып тұрыңыз."],
mdl:["ЭЦП мен құжаттардың электрондық көшірмелерін алдын ала дайындаңыз: өтініштер онлайн қабылданады.","Грантқа өтінішті ЖОО қабылдау комиссиясы арқылы немесе онлайн, яғни ЖОО-ның виртуалды қабылдау комиссиясы не eGov порталы арқылы беруге болады. ЖОО мен бағдарламаны өтініштің ішінде таңдайсыз.","Соңғы күнге қалдырмаңыз: грантқа өтініш беру мерзімі қысқа (2026 жылы 8 күн).","Құжаттар тізімі мен тәртібін таңдаған ЖОО сайтынан және Ғылым және жоғары білім министрлігінің хабарландыруынан нақтылаңыз.","Грант тізімі жарияланған соң өз тегіңізді тексеріңіз және қабылдау комиссиясының нұсқауларын орындаңыз."],
aml:["Қиындығы әр түрлі 5–8 ЖОО таңдап, әрқайсысының ресми бетінен талаптарды тексеріңіз.","Тіл тестін алдын ала тапсырыңыз: нәтиженің қолданылу мерзімі шектеулі, ол тест пен ЖОО сайтында көрсетілген.","Құжаттарды дайындаңыз: төлқұжат, аттестат немесе транскрипт (кейде аудармасымен), мотивациялық хат, ұсынымдар.","Әр ЖОО-ның дедлайнын біліңіз: олар әртүрлі және жылдан жылға өзгереді.","Оқу ақысын, стипендияларды, визаны және қаржылық растауды алдын ала қарастырыңыз."],
